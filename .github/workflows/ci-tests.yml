name: CI Tests - Fraud Detection
on: [push, pull_request]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Validate dependencies
      run: |
        python -m pip check

    - name: Install DVC
      run: |
        pip install dvc

    - name: Configure DVC with DagsHub
      run: |
        dvc remote modify --local dagshub url https://dagshub.com/${{ secrets.DAGSHUB_USER || github.repository_owner }}/${{ secrets.DAGSHUB_REPO_NAME || github.event.repository.name }}.dvc
        dvc remote modify --local dagshub auth basic
        dvc remote modify --local dagshub user ${{ secrets.DAGSHUB_USER || github.repository_owner }}
        dvc remote modify --local dagshub password ${{ secrets.DAGSHUB_TOKEN }}
        dvc remote list
        dvc remote default

    - name: Pull data and model from DVC
      run: |
        dvc pull

    - name: Run test suite
      run: |
        pytest -q

    - name: Test DVC reproducibility
      run: |
        echo "Verificando se DVC está configurado corretamente..."
        dvc status
        dvc version
