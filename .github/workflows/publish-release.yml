name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
      - "snapshot"
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar/atualizar como Release (ex: v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    if: github.event_name != 'create' || github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          OWNER="${REPO_FULL%%/*}"
          REPO="${REPO_FULL##*/}"

          sha="$(git rev-list -n 1 "$TAG")"

          prerelease="false"
          title="$TAG"
          notes=""

          if [ "$TAG" = "snapshot" ]; then
            prerelease="true"
            title="snapshot — Entrega original (referência)"
            notes=$'Snapshot do estado original do modelo (sem reescrever histórico).\n\n- Tag: snapshot\n- Commit: '"$sha"$'\n\nUse este ponto para referência da entrega original.'
          elif [ "$TAG" = "v1.0.0" ]; then
            title="v1.0.0 — Entrega original do modelo"
            notes=$'Entrega original do modelo, preservando o histórico.\n\n- Tag: v1.0.0\n- Commit: '"$sha"$'\n\nInclui estrutura do repositório e pipeline MLOps conforme entrega original.'
          elif [ "$TAG" = "v1.1.0" ]; then
            title="v1.1.0 — Rename + DagsHub/DVC/CI"
            notes=$'Ajustes pós-rename do repositório e correções de integração com DagsHub/DVC/CI.\n\n- Tag: v1.1.0\n- Commit: '"$sha"$'\n\nPrincipais pontos:\n- Links e instruções atualizados no README\n- DVC remoto alinhado ao novo repositório no DagsHub\n- GitHub Actions executa dvc pull + testes usando secrets\n\nObservação: credenciais do DagsHub devem ser configuradas via secrets/--local (não versionar tokens).'
          else
            title="$TAG"
            notes=$'Release publicada automaticamente.\n\n- Tag: '"$TAG"$'\n- Commit: '"$sha"
          fi

          release_id="$(gh api "/repos/$OWNER/$REPO/releases/tags/$TAG" -q .id 2>/dev/null || true)"

          if [ -z "$release_id" ]; then
            created="$(gh api -X POST "/repos/$OWNER/$REPO/releases" \
              -f tag_name="$TAG" \
              -f name="$title" \
              -f body="$notes" \
              -F prerelease="$prerelease" \
              -F draft=false)"
          else
            created="$(gh api -X PATCH "/repos/$OWNER/$REPO/releases/$release_id" \
              -f tag_name="$TAG" \
              -f name="$title" \
              -f body="$notes" \
              -F prerelease="$prerelease" \
              -F draft=false)"
          fi

          html_url="$(echo "$created" | jq -r .html_url)"
          echo "Release pronta: $html_url"
